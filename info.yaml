# Tiny Tapeout project information
project:
  title:        "Custom APU"      # Project title
  author:       "Frederick Mensah"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "an 8 bit adder that adds two 8 bit numbers together"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_adder_fredm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (inputs for num_1)
  ui[0]: "bit 0 of num_1"
  ui[1]: "bit 1 of num_1"
  ui[2]: "bit 2 of num_1"
  ui[3]: "bit 3 of num_1"
  ui[4]: "bit 4 of num_1"
  ui[5]: "bit 5 of num_1"
  ui[6]: "bit 6 of num_1"
  ui[7]: "bit 7 of num_1"

  # Outputs (sum bits for the two numbers, ignore the carry out bit )
  uo[0]: "sum bit 0 of num_1 + num_2"
  uo[1]: "sum bit 1 of num_1 + num_2"
  uo[2]: "sum bit 2 of num_1 + num_2"
  uo[3]: "sum bit 3 of num_1 + num_2"
  uo[4]: "sum bit 4 of num_1 + num_2"
  uo[5]: "sum bit 5 of num_1 + num_2"
  uo[6]: "sum bit 6 of num_1 + num_2"
  uo[7]: "sum bit 7 of num_1 + num_2"

  # Bidirectional pins (use as inputs for num_2)
  uio[0]: "bit 0 of num_2"
  uio[1]: "bit 1 of num_2"
  uio[2]: "bit 2 of num_2"
  uio[3]: "bit 3 of num_2"
  uio[4]: "bit 4 of num_2"
  uio[5]: "bit 5 of num_2"
  uio[6]: "bit 6 of num_2"
  uio[7]: "bit 7 of num_2"

# Do not change!
yaml_version: 6
